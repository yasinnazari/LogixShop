{% load static %}

<section class="hero">
   <div class="container">
      <div class="row align-items-center">

         <div class="col-lg-6">

            <span class="hero-label">LOGIX COMMUNITY</span>

            <h1 class="hero-heading">
               Click. Buy. <span>Done.</span>
            </h1>

            <p class="hero-description">
               Great Products Better Deals
            </p>

            <div class="d-flex gap-3 mt-5">
               <a class="btn btn-dark hero-btn rounded" href="#products">
                  Shop Now <i class="bi bi-arrow-right ms-2"></i>
               </a>

               <a class="btn btn-outline-dark hero-btn rounded" href="#categories">
                  Explore Categories
               </a>
            </div>

            <div class="hero-stats">

               <div>
                  <strong>200+</strong>
                  <span>Products</span>
               </div>

               <div>
                  <strong>4.7</strong>
                  <span>Customer Rating</span>
               </div>

               <div>
                  <strong>24/7</strong>
                  <span>Support</span>
               </div>

            </div>

         </div>

         <div class="col-lg-6">
               <div class="hero-image-wrapper">
                  <img class="hero-image" src="{% static 'assets/VectorShop1.jpg' %}" alt="LogixShop">
               </div>
         </div>

      </div>
   </div>
</section>
