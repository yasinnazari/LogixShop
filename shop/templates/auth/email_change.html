{% extends "main/base.html" %}
{% block title %}Change email{% endblock %}
{% block content %}<section class="py-5"><div class="container col-md-5"><h1>Change email</h1>{% include "auth/_errors.html" %}<form method="post" novalidate>{% csrf_token %}<p><label>New email <input type="email" name="email" required></label>{% for error in errors.email %}<span class="text-danger">{{ error }}</span>{% endfor %}</p><p><label>Current password <input type="password" name="current_password" required></label>{% for error in errors.current_password %}<span class="text-danger">{{ error }}</span>{% endfor %}</p><button class="btn btn-primary">Send verification code</button></form></div></section>{% endblock %}
