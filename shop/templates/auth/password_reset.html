{% extends "main/base.html" %}
{% block title %}Reset password{% endblock %}
{% block content %}<section class="py-5"><div class="container col-md-5"><h1>Reset password</h1>{% include "auth/_errors.html" %}<form method="post" novalidate>{% csrf_token %}<p><label>Email <input type="email" name="email" autocomplete="email" required></label>{% for error in errors.email %}<span class="text-danger">{{ error }}</span>{% endfor %}</p><button class="btn btn-primary">Send reset link</button></form></div></section>{% endblock %}
