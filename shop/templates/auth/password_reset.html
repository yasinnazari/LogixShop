{% extends "main/base.html" %}

{% block title %}Reset Password{% endblock %}

{% block content %}
   <section class="py-5">
      <div class="container mt-5 mb-5">
         <div class="row justify-content-center">
               <div class="col-12 col-sm-10 col-md-7 col-lg-5">

                  <div class="card border-0 shadow-sm rounded-4">
                     <div class="card-body p-4 p-md-5">

                        <div class="text-center mb-4">
                           <div class="d-inline-flex align-items-center justify-content-center rounded-circle bg-primary bg-opacity-10 mb-3" style="width: 64px; height: 64px;">
                              <i class="bi bi-shield-lock text-primary fs-2"></i>
                           </div>

                           <h1 class="h3 fw-bold mb-2">
                              Reset Password
                           </h1><br>

                        </div>

                        {% include "auth/_errors.html" %}

                        <form method="post" novalidate>
                           {% csrf_token %}

                           <div class="mb-4">
                              <input
                                 type="email"
                                 id="email"
                                 name="email"
                                 placeholder="Enter email address"
                                 class="form-control form-control-lg rounded-3"
                                 autocomplete="email"
                                 required
                                 autofocus
                                 value="{{ request.POST.email|default:'' }}"
                              >

                              {% for error in errors.email %}
                                 <div class="text-danger small mt-2">
                                    {{ error }}
                                 </div>
                              {% endfor %}
                           </div>

                           <button type="submit" class="btn btn-primary btn-lg w-100 rounded-3 mt-3">
                              <i class="bi bi-envelope me-1"></i>
                              Send Reset Link
                           </button>
                        </form>

                        <div class="text-center mt-5">
                           <a href="{% url 'shop:login' %}"
                              class="text-decoration-none small">
                              <i class="bi bi-arrow-left me-1"></i>
                              Back to Sign in
                           </a>
                        </div>

                     </div>
                  </div>

               </div>
         </div>
      </div>
   </section>
{% endblock %}
