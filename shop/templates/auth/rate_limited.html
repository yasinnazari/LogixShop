{% extends "main/base.html" %}

{% block title %}Please Try Again Later{% endblock %}

{% block content %}
   <section class="py-5">
      <div class="container">
         <div class="row justify-content-center mt-5 mb-5">
               <div class="col-md-6 col-lg-5">
                  <div class="card border-0 shadow-sm rounded-4 text-center p-4 p-md-5">

                     <div class="mb-4">
                           <div class="auth-status-icon auth-status-icon--warning rounded-circle bg-warning bg-opacity-10">
                              <i class="bi bi-hourglass-split text-warning fs-1"></i>
                           </div>
                     </div>

                     <h1 class="h3 fw-bold mb-3">
                           Please Try Again Later
                     </h1>

                     <p class="text-muted mb-4">
                           Too many requests. Please wait a moment and try again.
                     </p>

                     <a href="{% url 'shop:home' %}"
                        class="btn btn-primary rounded-3 px-4">
                           <i class="bi bi-house-door me-2"></i>
                           Back to Home
                     </a>

                  </div>
               </div>
         </div>
      </div>
   </section>
{% endblock %}
