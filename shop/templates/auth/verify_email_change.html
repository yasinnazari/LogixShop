{% extends "main/base.html" %}

{% block title %}Verify new email{% endblock %}

{% block content %}
<section class="py-5">
   <div class="container col-md-5">
      <h1>Verify new email</h1>
      {% include "auth/_errors.html" %}

      <form method="post" novalidate>
         {% csrf_token %}

         <p>
            <label for="email">New email</label>
            <input id="email" type="email" name="email" value="{{ email }}" required>
            {% for error in errors.email %}
               <span class="text-danger">{{ error }}</span>
            {% endfor %}
         </p>

         <p>
            <label for="verification-code">Six-digit code</label>
            <input id="verification-code" name="code" inputmode="numeric" pattern="[0-9]{6}" autocomplete="one-time-code" required>
            {% for error in errors.code %}
               <span class="text-danger">{{ error }}</span>
            {% endfor %}
         </p>

         <button class="btn btn-primary" type="submit">Verify and change email</button>
      </form>
   </div>
</section>
{% endblock %}
